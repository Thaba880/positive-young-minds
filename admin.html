<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Positive Young Minds</title><link rel="stylesheet" href="assets/css/styles.css"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';"></head>
<body><header><div class="nav"><a class="brand" href="index.html"><span class="brand-mark"><img src="assets/img/logo.jpg" alt="Positive Young Minds logo" style="width:42px;height:42px;border-radius:50%;object-fit:cover"></span><span class="brand-name"><small>POSITIVE YOUNG MINDS</small>Admin</span></a><nav class="main"><a href="index.html">Opportunities</a><a href="task1.html">Organisation</a><button class="btn btn-sm" onclick="logout()">Logout</button></nav></div></header>
<div class="wrap"><h1>Admin Dashboard</h1><div id="loginBox" class="card setup-card"><h2>Admin Login</h2><p class="muted">5 failed attempts = 15-minute lockout. No password is stored in plain text — only SHA-256 hashes.</p><label>Email</label><input id="aEmail" type="email" placeholder="positiveyoungmindsoffice@gmail.com"><label>Password</label><input id="aPass" type="password" placeholder="Password"><button class="btn" onclick="doAdminLogin()">Login →</button><p id="aMsg"></p><p class="muted">Lab credentials are in SECURITY_LAB_GUIDE.md — given by the instructor, not in the code.</p></div><div id="adminBody" class="hidden"></div></div><div class="toast" id="toast"></div>
<script src="assets/js/shared.js"></script><script>headerAuth();
async function doAdminLogin(){ const r=await loginSecure(document.getElementById("aEmail").value, document.getElementById("aPass").value); document.getElementById("aMsg").textContent=r.ok?"":""+r.msg; if(!r.ok) return; if(r.user.role!=="Admin"){document.getElementById("aMsg").textContent="This login is for Admins only."; clearSession(); return;} renderAdmin(); }
function renderAdmin(){ const u=currentUser(); if(!u||u.role!=="Admin"){document.getElementById("loginBox").classList.remove("hidden"); return;} document.getElementById("loginBox").classList.add("hidden"); const b=document.getElementById("adminBody"); b.classList.remove("hidden");
 if(adminPasswordExpired(u)){ b.innerHTML=`<div class="expiry-banner"><h2>🔐 Password Expired — Change Required</h2><p>Last changed <b>${daysSince(u.passwordChangedAt)} days ago</b>. Admins must change password <b>every 30 days</b>. Dashboard is blocked until you change it.</p><label>New password (min 8, include number)</label><input id="np1" type="password"><label>Confirm</label><input id="np2" type="password"><button class="btn" onclick="forceChange()">Change Password & Continue →</button><p id="pwMsg"></p></div>`; return; }
 const pend=state.opps.filter(o=>o.status==="Pending");
 b.innerHTML=`<div class="card"><h3>🔐 Admin Password</h3><p>Last changed: <b>${esc(u.passwordChangedAt)}</b> • <b>${adminPasswordDaysLeft(u)} days left</b> (30-day rule). You can update anytime.</p><div class="flex"><input id="chgPass" type="password" placeholder="New password (min 8)" style="max-width:280px"><button class="btn btn-sm" onclick="changeAnytime()">Update Password</button></div><p id="chgMsg"></p></div>
 <div class="kpis"><div class="kpi"><b>${state.opps.length}</b><span class="muted">Total Opportunities</span></div><div class="kpi"><b>${pend.length}</b><span class="muted">Pending Approval</span></div><div class="kpi"><b>${state.applications.length}</b><span class="muted">Applications</span></div><div class="kpi"><b>${state.audit.length}</b><span class="muted">Audit Log Entries</span></div></div>
 <div class="card"><h3>⏳ Pending Approvals — Nothing goes live without Admin</h3>${pend.length?pend.map(o=>`<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0"><b>${esc(o.title)}</b> — ${esc(o.org)} • ${esc(o.type)} • ${esc(o.location)}<p>${esc(o.desc)}</p><button class="btn btn-sm" onclick="approveOpp('${esc(o.id)}')">✅ Approve & Publish</button> <button class="btn btn-ghost btn-sm" onclick="rejectOpp('${esc(o.id)}')">❌ Reject</button></div>`).join(""):"<p>No pending opportunities.</p>"}</div>
 <div class="card"><h3>📋 Audit Log (last 20)</h3>${state.audit.slice(0,20).map(a=>`<p><b>${esc(a.action)}</b> — ${esc(a.detail)} • ${esc(a.by)} • ${esc(a.at)}</p>`).join("")||"<p>No activity yet.</p>"}</div>
 <div class="card"><h3>All Opportunities</h3>${state.opps.map(o=>`<p><b>${esc(o.title)}</b> — ${esc(o.status)} • ${esc(o.type)}</p>`).join("")}</div>`; }
async function forceChange(){ const p1=document.getElementById("np1").value,p2=document.getElementById("np2").value; if(p1.length<8||!/\d/.test(p1)){document.getElementById("pwMsg").textContent="Password must be at least 8 characters and include a number.";return;} if(p1!==p2){document.getElementById("pwMsg").textContent="Passwords do not match.";return;} await updateAdminPassword(p1); toast("Password updated — good for 30 days"); renderAdmin(); }
async function changeAnytime(){ const p=document.getElementById("chgPass").value; if(p.length<8||!/\d/.test(p)){document.getElementById("chgMsg").textContent="Min 8 characters + a number.";return;} await updateAdminPassword(p); document.getElementById("chgMsg").textContent="✅ Password updated. Next change due in 30 days."; renderAdmin(); }
function approveOpp(id){ const o=state.opps.find(x=>x.id===id); if(!o) return; o.status="Approved"; save(); audit("APPROVE","Approved "+o.title); toast("Approved & Published"); renderAdmin(); }
function rejectOpp(id){ const o=state.opps.find(x=>x.id===id); if(!o) return; o.status="Rejected"; save(); audit("REJECT","Rejected "+o.title); toast("Rejected"); renderAdmin(); }
if(currentUser() && currentUser().role==="Admin") renderAdmin();
</script></body></html>
